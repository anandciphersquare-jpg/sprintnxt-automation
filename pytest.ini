[pytest]
pythonpath = .
testpaths = tests
# Video + Playwright trace are recorded for every test and kept only for failures (shown in the report).
# Override per run, e.g. --video=off --tracing=off for a faster local loop.
addopts = -ra -q --video=retain-on-failure --tracing=retain-on-failure
markers =
    smoke: core happy-path checks
    positive: valid-input / happy-path tests
    negative: invalid-input / error-handling tests
    security: security tests (SQL injection, XSS, injection, enumeration)
    e2e: full end-to-end merchant journey
    registration: registration flow
    login: login flow
    change_password: change-password flow
    forgot_password: forgot-password flow
    admin: admin activation flow
    api_access: merchant API Access Control (API keys)
    add_bank: Add Bank form, services and validation
    bank_approval: add bank -> admin accepts in New Bank Requests -> merchant dashboard
